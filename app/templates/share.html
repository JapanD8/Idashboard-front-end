          <!-- Main Container -->

          <div id="admin-panel">            
            <div class="admin-panel">
                <h2 class="admin-title">
                    <span>🔗</span>
                    Share Resources with Users
                </h2>
                
               <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Select User</label>
                        <select class="form-select" id="userSelect" onchange="updateResourceSelections()">
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Selected Resources <span id="selectedCount">(0)</span></label>
                        <input type="text" class="form-input" id="selectedResources" readonly placeholder="Select resources below">
                    </div>
                    
                    <div class="form-group">
                        <button class="share-btn" onclick="shareResources()" id="shareBtn" disabled>
                            Share
                        </button>
                    </div>

                    <div class="form-group">
                        <button class="remove-btn" onclick="removeResources()" id="removeBtn" disabled>
                            Remove
                        </button>
                    </div>

                    
                </div>
                <div class="add-button">
                  <div class="form-row">
                  <div class="form">
                     <input type="text" class="form-input" id="addnewuserresources"  placeholder="New user...">
                  </div>
               <div class="form">
               
                      <button class="add-btn" onclick="addnewuserresource()" id="addBtn">
                         <div class="button-content">
                          <span id="button-text">Send Invite</span>
                          <span id="loading-animation" style="display: none;" class="loading-dots">
                              <span class="dot"></span>
                              <span class="dot"></span>
                              <span class="dot"></span>
                          </span>
                          </div>
                      </button>
                    
                  </div>
                   </div>
                </div>
                
                 

                <div class="resources-section">
                    <!-- Connection Resources Section -->
                    <div style="margin-bottom: 2rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h3 class="section-title">🔗 Connection Resources</h3>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn-secondary" onclick="selectAllConnections()" style="padding: 0.5rem 1rem; font-size: 0.75rem;">Select All</button>
                                <button class="btn-secondary" onclick="clearConnectionSelections()" style="padding: 0.5rem 1rem; font-size: 0.75rem;">Clear All</button>
                            </div>
                        </div>
                        <div class="resources-grid" id="connectionsGrid">
                            <!-- Connection resources will be populated here -->
                        </div>
                    </div>

                    <!-- Agent Resources Section -->
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                            <h3 class="section-title">🤖 AI Agent Resources</h3>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn-secondary" onclick="selectAllAgents()" style="padding: 0.5rem 1rem; font-size: 0.75rem;">Select All</button>
                                <button class="btn-secondary" onclick="clearAgentSelections()" style="padding: 0.5rem 1rem; font-size: 0.75rem;">Clear All</button>
                            </div>
                        </div>
                        <div class="resources-grid" id="agentsGrid">
                            <!-- Agent resources will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Dashboard -->

            <!-- Owned Resources -->
            <div class="dashboard-section">
                <div class="section-header">
                    <h3 class="section-title">
                        <span>📂</span>
                        My Resources 
                        <span class="badge owned-badge" id="ownedCount">0</span>
                    </h3>
                </div>
                <div class="resources-grid" id="ownedResources">
                    <!-- Owned resources will be populated here -->
                </div>
            </div>

            <!-- Shared Resources -->
            <div class="dashboard-section">

                        <span class="badge shared-badge" id="sharedCount">0</span>
                    </h3>
                </div>
                <div class="resources-grid" id="sharedResources">
                    <!-- Shared resources will be populated here -->
                </div>
            </div>
